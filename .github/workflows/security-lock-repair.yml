name: One-time PR 29 security lock repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/security-lock-repair.yml'

permissions:
  contents: read

concurrency:
  group: pr29-security-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'akaryc1b/next-subscription-manager' &&
      github.event.pull_request.number == 29 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/mobile-account-save-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply only the verified security patch versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!['15.5.21', '15.5.24'].includes(pkg.dependencies.next)) throw new Error('Unexpected Next.js baseline; refusing to overwrite concurrent work');
          pkg.dependencies.next = '15.5.24';
          pkg.devDependencies['eslint-config-next'] = '15.5.24';
          pkg.pnpm.overrides.sharp = '0.35.5';
          pkg.pnpm.overrides['source-map-js@<1.2.2'] = '1.2.2';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
      - name: Record the generated patch
        run: |
          mkdir -p security-lock-evidence
          cp package.json pnpm-lock.yaml security-lock-evidence/
          git diff -- package.json pnpm-lock.yaml > security-lock-evidence/dependencies.patch
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: pr29-security-lock
          path: security-lock-evidence/
          retention-days: 7
      - name: Commit only dependency files to the authorized PR branch
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json pnpm-lock.yaml
          git commit -m 'fix: patch Next.js, sharp and source-map-js security vulnerabilities'
          git push origin HEAD:refs/heads/fix/mobile-account-save-delivery
