name: Materialize administrator review edits
on:
  push:
    branches: [fix/admin-only-subscription-accounts]
    paths: [.github/workflows/admin-reviewed-edits.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ca53801abc7e9dc87fdac027d5b8c172b43b41b1
          persist-credentials: false
      - name: Apply exact reviewed text edits into immutable Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          base = 'https://api.github.com/repos/akaryc1b/next-subscription-manager/git/'
          def call(path, payload=None):
              req = urllib.request.Request(base + path, data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=40) as response: return json.load(response)
          plan = json.loads(base64.b64decode(call('blobs/c48339624d27bef8595e0c8fd1656c07112c225a')['content']))
          allowed = {'CLAUDE.md','DESIGN.md','README.md','docs/orbit-workspace.md','src/app/(auth)/login/page.tsx','src/app/api/workspace/route.ts','src/components/workspace/auth-ui.tsx','src/components/workspace/login.tsx','src/components/workspace/renewals.tsx','src/lib/workspace.ts','tests/browser/workspace.e2e.mjs','tests/browser/z-merge-regressions.e2e.mjs','tests/browser/z-product.e2e.mjs'}
          assert set(plan) == allowed
          entries = []
          for path, delta in plan.items():
              text = pathlib.Path(path).read_bytes().decode('utf-8')
              assert hashlib.sha256(text.encode()).hexdigest() == delta['source'], 'Source mismatch: ' + path
              for original, replacement in delta['edits']:
                  assert text.count(original) == 1, 'Ambiguous edit: ' + path
                  text = text.replace(original, replacement, 1)
              assert hashlib.sha256(text.encode()).hexdigest() == delta['target'], 'Target mismatch: ' + path
              blob = call('blobs', {'content': text, 'encoding': 'utf-8'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = call('trees', {'base_tree': 'a3743001e865b8b00006eb3cf89b73b6bf9ed407', 'tree': entries})
          print('Verified tree:', tree['sha'])
          print(json.dumps(entries))
          pathlib.Path('/tmp/admin-reviewed-tree.json').write_text(json.dumps({'tree': tree['sha'], 'entries': entries}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: admin-reviewed-tree
          path: /tmp/admin-reviewed-tree.json
          retention-days: 7
