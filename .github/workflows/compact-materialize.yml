name: Materialize compact workspace
on:
  push:
    branches: [fix/compact-mobile-workspace]
    paths: [.github/workflows/compact-materialize.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e68f0a90c5fa5f8b4345b0442eac1d527537a22d
          persist-credentials: false
      - name: Verify exact reviewed changes and create immutable Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          api = 'https://api.github.com/repos/akaryc1b/next-subscription-manager/git/'
          def call(path, payload=None):
              req = urllib.request.Request(api + path, data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response)
          parts = ['6aad4fd6f07ffa990c7ff101f1e315ffc6687f3a', '0993955e0ac713da4acbf77f9f0af7bc9605008d', 'efce4e406e8edeb408150c8780b92e92088ead5d', 'd7e84228c40fb762f681387b6940b7b448d2915c']
          archive = b''.join(base64.b64decode(call('blobs/' + sha)['content']) for sha in parts)
          assert hashlib.sha256(archive).hexdigest() == '405c06f94e8d22996b6e185884f2162574489f2dc57cc3fb7c78e684cb968c0a', 'Delta package hash mismatch'
          changes = json.loads(gzip.decompress(archive))
          entries = []
          for path, delta in changes.items():
              assert not pathlib.PurePosixPath(path).is_absolute() and '..' not in pathlib.PurePosixPath(path).parts
              base = delta['base']
              if base:
                  assert not pathlib.PurePosixPath(base).is_absolute() and '..' not in pathlib.PurePosixPath(base).parts
              original = pathlib.Path(base).read_bytes().decode('utf-8') if base else ''
              assert hashlib.sha256(original.encode()).hexdigest() == delta['baseSha256'], 'Source mismatch: ' + path
              content = original
              for start, end, replacement in reversed(delta['edits']):
                  content = content[:start] + replacement + content[end:]
              assert hashlib.sha256(content.encode()).hexdigest() == delta['sha256'], 'Target mismatch: ' + path
              blob = call('blobs', {'content': content, 'encoding': 'utf-8'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = call('trees', {'base_tree': '7d6cd9fd7e6137b5dad224dd2685e7d0d6d3de9f', 'tree': entries})
          assert tree['sha'] == 'd70d05fe69f5a037b7d0f8bb602c722be00f399e', 'Final tree mismatch'
          result = {'tree': tree['sha'], 'base': 'e68f0a90c5fa5f8b4345b0442eac1d527537a22d', 'entries': entries}
          pathlib.Path('/tmp/compact-target-tree.json').write_text(json.dumps(result, indent=2))
          print('Verified immutable tree:', tree['sha'], 'files:', len(entries))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-target-tree
          path: /tmp/compact-target-tree.json
          retention-days: 7
