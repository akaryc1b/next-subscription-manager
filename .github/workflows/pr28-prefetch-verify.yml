name: Prepare PR28 prefetch boundary verification
on:
  pull_request:
    paths: [.github/workflows/pr28-prefetch-verify.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-only-subscription-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Distinguish full navigation from empty dynamic prefetch
        shell: bash
        run: |
          test "$(git hash-object tests/browser/z-admin-boundaries.e2e.mjs)" = b212558941e2060aab2cd8ec61ae94905a9e952e
          test "$(git hash-object docs/admin-access-audit.md)" = 8fe89944b101a67eeef5ec283d23ba523e319478
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, f'Unexpected source: {path}: {old[:80]}'
              p.write_text(text.replace(old, new))
          p = 'tests/browser/z-admin-boundaries.e2e.mjs'
          replace(p, "for (const headers of [{}, { RSC: '1', 'Next-Router-Prefetch': '1' }])", "for (const headers of [{}, { RSC: '1' }, { RSC: '1', 'Next-Router-Prefetch': '1' }])")
          old = "        expect(destination).toContain('/login')\n        if (response.status() === 200) expect(text).toContain('NEXT_REDIRECT')"
          new = '''        if (headers['Next-Router-Prefetch'] && response.status() === 200 && !text.includes('NEXT_REDIRECT')) {
                    // Next 15 may skip dynamic rendering during automatic prefetch.
                    // Accept only the observed empty Flight envelope, never an
                    // arbitrary 200 page, component payload, or additional rows.
                    expect(response.headers()['content-type']).toContain('text/x-component')
                    const rows = text.trim().split('\\n')
                    expect(rows).toHaveLength(1)
                    expect(rows[0].startsWith('0:')).toBe(true)
                    const payload = JSON.parse(rows[0].slice(2))
                    expect(Object.keys(payload).sort()).toEqual(['S', 'b', 'f'])
                    expect(typeof payload.b).toBe('string')
                    expect(payload.S).toBe(false)
                    expect(payload.f).toHaveLength(1)
                    expect(payload.f[0]).toHaveLength(4)
                    expect(payload.f[0][1]).toBeNull()
                    expect(payload.f[0][2]).toEqual([null, null])
                    expect(payload.f[0][3]).toBe(true)
                  } else {
                    // Both HTML and a full RSC navigation must execute the guard.
                    expect(destination).toContain('/login')
                    if (response.status() === 200) expect(text).toContain('NEXT_REDIRECT')
                  }'''
          new = new.replace('\n          ', '\n')
          replace(p, old, new)
          replace('docs/admin-access-audit.md', '六个页面分别检查 HTML 与 RSC/预取请求的登录重定向及敏感信息缺席，并用浏览器确认未显示后台导航。', '六个页面分别检查 HTML、完整 RSC 导航及自动预取。HTML 与完整 RSC 必须触发登录重定向；Next 15 动态路由自动预取若跳过渲染，只允许单行、无组件 seed/页面 head 的空 Flight 协议响应，不接受任意 200 内容。三种路径均检查敏感信息缺席，并用浏览器确认未显示后台导航。')
          PY
          node --check tests/browser/z-admin-boundaries.e2e.mjs
          git diff --check
          git add tests/browser/z-admin-boundaries.e2e.mjs docs/admin-access-audit.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: require guarded navigation and strictly empty dynamic prefetch'
          git push origin HEAD:fix/admin-only-subscription-accounts
