name: Administrator review sources
on:
  push:
    branches: [fix/admin-only-subscription-accounts]
    paths: [.github/workflows/admin-review-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ca53801abc7e9dc87fdac027d5b8c172b43b41b1
          persist-credentials: false
      - run: git archive HEAD -o /tmp/admin-review-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: admin-review-source
          path: /tmp/admin-review-source.tar
          retention-days: 7
