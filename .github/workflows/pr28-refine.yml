name: Prepare PR28 verification refinements
on:
  pull_request:
    paths:
      - .github/workflows/pr28-refine.yml
permissions:
  contents: write
jobs:
  refine:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-only-subscription-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Keep refusal assertions and use the shipped auth instance
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 020089378db792000d03d6132fece90ac29505af
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              source = p.read_text()
              assert source.count(old) == 1, f'Unexpected source: {path}: {old[:100]}'
              p.write_text(source.replace(old, new))
          p = 'tests/browser/z-oauth-policy.e2e.mjs'
          replace(p, 'let previousPrisma', "let previousPrisma\nconst providerEnvironment = ['GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET']\nconst previousProviderEnvironment = new Map()")
          replace(p, '  production = (await tsImport', "  for (const key of providerEnvironment) {\n    previousProviderEnvironment.set(key, process.env[key])\n    process.env[key] = `isolated-${key.toLowerCase()}`\n  }\n  production = (await tsImport")
          replace(p, "  if (previousPrisma === undefined)", "  for (const key of providerEnvironment) {\n    const value = previousProviderEnvironment.get(key)\n    if (value === undefined) delete process.env[key]\n    else process.env[key] = value\n  }\n  if (previousPrisma === undefined)")
          replace(p, "  const instance = betterAuth({ ...production.options, socialProviders: {\n    github: { clientId: 'fixture-client-id', clientSecret: 'fixture-client-secret', disableImplicitSignUp: true },\n  } })", "  // Use the actual shipped factory/adapter/hook graph. tsImport isolates module\n  // identity; copying options into a second native-ESM factory disconnects the\n  // request-state keys used by getOAuthState from the source-loaded guard.\n  const instance = production\n  expect(instance.options.socialProviders.github).toBeTruthy()")
          with Path(p).open('a') as file:
              file.write('''\n\nfor (const forged of [false, true]) {
            test(`legacy explicit state cannot authorize a live administrator session (forged proof: ${forged})`, async () => {
              const flow = await setup({ explicit: true, legacy: true,
                additionalData: forged ? (user, session) => ({ adminLinkAuthorization: { userId: user.id, sessionId: session.id, signature: '0'.repeat(64) } }) : undefined,
              })
              expect(await db.session.count({ where: { id: flow.sessionId } })).toBe(1)
              await expectDenied(await flow.callback())
              expect(await db.account.count({ where: { userId: flow.user.id } })).toBe(0)
            })
          }
          ''')
          p = 'tests/browser/z-compact-mobile.e2e.mjs'
          replace(p, "  const style = element => {", "  // Observe the final rendered theme, not different frames of a color transition.\n  await group.evaluate(async element => {\n    const animations = element.getAnimations({ subtree: true }).filter(animation => Number.isFinite(animation.effect?.getComputedTiming().endTime))\n    await Promise.allSettled(animations.map(animation => animation.finished))\n  })\n  const style = element => {")
          PY
          node --check tests/browser/z-oauth-policy.e2e.mjs
          node --check tests/browser/z-compact-mobile.e2e.mjs
          git diff --check
          git add tests/browser/z-oauth-policy.e2e.mjs tests/browser/z-compact-mobile.e2e.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: exercise shipped OAuth state graph and stable theme styles'
          git push origin HEAD:fix/admin-only-subscription-accounts
          git rev-parse HEAD
