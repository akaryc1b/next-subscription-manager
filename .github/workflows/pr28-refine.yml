name: Prepare PR28 refinements
on:
  pull_request:
    paths:
      - .github/workflows/pr28-refine.yml
permissions:
  contents: write
jobs:
  refine:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-only-subscription-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Apply exact scoped changes
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = f5b135b1d6b7a1a34e61943a75af70bef517ba9d
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              source = p.read_text()
              assert source.count(old) == 1, f'Unexpected source: {path}: {old[:80]}'
              p.write_text(source.replace(old, new))
          def append(path, text):
              p = Path(path)
              p.write_text(p.read_text().rstrip() + '\n\n' + text.strip() + '\n')
          Path('src/components/workspace/subscription-actions.tsx').write_text('''"use client"

          import { Copy, Rocket } from 'lucide-react'
          import { Action } from './ui'

          type Props = {
            disabled: boolean
            onCopy: (rocket: boolean) => void
            email?: string
            compact?: boolean
          }

          /** Presentation only: invoke the caller in the original click task. */
          export function SubscriptionActions({ disabled, onCopy, email, compact = false }: Props) {
            const name = (kind: string) => email ? `复制 ${email} 的 ${kind}链接` : `复制${kind === '订阅' ? '' : ' '}${kind}链接`
            return <div className="o-delivery-actions" data-compact={compact || undefined} role="group" aria-label="订阅链接交付" aria-busy={disabled}>
              <Action variant={compact ? 'quiet' : 'secondary'} data-link-kind="subscription" disabled={disabled} aria-label={name('订阅')} title="复制订阅链接" onClick={() => onCopy(false)}><Copy aria-hidden="true"/><span>{compact ? '订阅' : '复制订阅链接'}</span></Action>
              <Action variant={compact ? 'quiet' : 'secondary'} data-link-kind="shadowrocket" disabled={disabled} aria-label={name('Shadowrocket ')} title="复制 Shadowrocket 链接" onClick={() => onCopy(true)}><Rocket aria-hidden="true"/><span>{compact ? 'Shadowrocket' : '复制 Shadowrocket 链接'}</span></Action>
            </div>
          }
          '''.replace('\n          ', '\n'))
          p = 'src/components/workspace/accounts.tsx'
          replace(p, 'ArrowUpRight, Copy, Plus, Rocket, Search', 'ArrowUpRight, Plus, Search')
          replace(p, "import { copyAccountLink } from './subscription-link'", "import { copyAccountLink } from './subscription-link'\nimport { SubscriptionActions } from './subscription-actions'")
          replace(p, '''{account.subscription && <><Action className="o-rocket-copy" aria-label={`复制 ${account.email} 的 Shadowrocket 链接`} title="复制 Shadowrocket 链接" disabled={copying !== null} onClick={() => void copy(account.id, true)}><Rocket/><span>Shadowrocket</span></Action><Action variant="quiet" aria-label={`复制 ${account.email} 的订阅链接`} title="复制订阅链接" disabled={copying !== null} onClick={() => void copy(account.id)}><Copy/></Action></>}''', '''{account.subscription && <SubscriptionActions compact email={account.email} disabled={copying !== null} onCopy={rocket => void copy(account.id, rocket)}/>}''')
          p = 'src/components/workspace/account-editor.tsx'
          replace(p, 'ArrowUpRight, Copy, Search', 'ArrowUpRight, Search')
          replace(p, "import { copyAccountLink } from './subscription-link'", "import { copyAccountLink } from './subscription-link'\nimport { SubscriptionActions } from './subscription-actions'")
          replace(p, '''<div className="o-actions"><Action variant="primary" disabled={busy} onClick={() => void copy(true)}>复制 Shadowrocket 链接</Action><Action disabled={busy} onClick={() => void copy()}><Copy/>复制订阅链接</Action></div>''', '''<SubscriptionActions disabled={busy} onCopy={rocket => void copy(rocket)}/>''')
          replace(p, '''<div className="o-actions"><Action onClick={() => void copy()} disabled={busy}><Copy/>复制订阅链接</Action><Action onClick={() => void copy(true)} disabled={busy}>复制 Shadowrocket 链接</Action></div>''', '''<SubscriptionActions disabled={busy} onCopy={rocket => void copy(rocket)}/>''')
          p = 'src/styles/workspace.css'
          replace(p, '.o-rocket-copy{color:var(--o-accent);font-size:11px;background:var(--o-accent-soft)}\n', '')
          replace(p, '.o-row-actions .o-rocket-copy{padding:7px 10px;gap:6px}\n', '')
          replace(p, '  .o-row-actions .o-rocket-copy{padding:9px 12px;font-size:12px}\n', '')
          append(p, '''/* Delivery methods share Action tokens; no provider-specific visual theme. */
          .o-delivery-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;min-width:0;width:100%}
          .o-delivery-actions .o-button{min-height:44px}
          .o-delivery-actions[data-compact]{display:flex;align-items:center;gap:2px;width:auto;flex-shrink:0}
          .o-row-actions .o-delivery-actions .o-button{min-height:44px;padding:8px 10px;font-size:12px;gap:8px}
          .o-row-actions:has(.o-delivery-actions)>.o-button{min-height:44px;min-width:44px}
          @media(max-width:639px){.o-table .o-row-actions:has(.o-delivery-actions){gap:4px}.o-row-actions .o-delivery-actions .o-button{padding:8px}}
          ''')
          p = 'src/components/workspace/login.tsx'
          replace(p, '登录授权未完成，请重新选择登录方式。', '登录授权未完成。首次使用 GitHub 请先用管理员密码登录，再到设置绑定。')
          p = 'tests/browser/z-oauth-policy.e2e.mjs'
          replace(p, "import { createHmac, randomUUID } from 'node:crypto'", "import { createHmac, randomUUID } from 'node:crypto'\nimport { readFile } from 'node:fs/promises'")
          replace(p, 'async function setup({ bound = false, explicit = false } = {}) {', "async function setup({ bound = false, explicit = false, role = 'admin', legacy = false, additionalData } = {}) {")
          replace(p, "role: 'admin', name: 'OAuth fixture'", "role, name: 'OAuth fixture'")
          replace(p, '  const jar = new Map()', '''  // Legacy state is produced by the real library without the new initiation
            // hook. The callback always goes through the shipped, guarded options.
            const starter = legacy ? betterAuth({ ...instance.options, hooks: undefined,
              account: { ...instance.options.account, accountLinking: { ...instance.options.account.accountLinking, disableImplicitLinking: false } },
            }) : instance
            const jar = new Map()''')
          replace(p, '  if (explicit) {\n    const session = await context.internalAdapter.createSession(user.id)', '''  let session
            if (explicit) {
              session = legacy
                ? await db.session.create({ data: { userId: user.id, token: randomUUID(), expiresAt: new Date(Date.now() + 3600000) } })
                : await context.internalAdapter.createSession(user.id)''')
          replace(p, 'const beginRequest = () => instance.handler(', 'const beginRequest = () => starter.handler(')
          replace(p, "errorCallbackURL: `${origin}/login` }),", "errorCallbackURL: `${origin}/login`, additionalData: typeof additionalData === 'function' ? additionalData(user, session) : additionalData }),")
          replace(p, '  return { user, callback }', '  return { user, callback, sessionId: session?.id }')
          replace(p, "test('eligible administrators retain real OAuth sign-in and explicit linking paths'", "test('eligible administrators retain bound OAuth sign-in and explicit linking without implicit enrollment'")
          replace(p, '''    const response = await flow.callback()
              expect(response.status()).toBe(302)'''.replace('\n              ', '\n    '), '''    const response = await flow.callback()
              if (!explicit && !bound) {
                await expectDenied(response)
                expect(await db.account.count({ where: { userId: flow.user.id } })).toBe(0)
                expect(await db.session.count({ where: { userId: flow.user.id } })).toBe(0)
                continue
              }
              expect(response.status()).toBe(302)'''.replace('\n              ', '\n    '))
          append(p, '''async function administrator(page) {
            const state = JSON.parse(await readFile('tests/browser/.auth/state.json', 'utf8'))
            await page.context().addCookies(state.cookies)
          }
          async function updateAccount(page, userId, data) {
            const response = await page.request.put(`/api/users/${userId}`, { data })
            expect(response.status(), await response.text()).toBe(200)
          }
          function noNewSessionCookie(response) {
            expect(response.headers.getSetCookie().filter(value => /(?:^|;)\\s*(?:__Secure-)?better-auth\\.session_token=[^;]/.test(value))).toEqual([])
          }
          for (const bound of [false, true]) {
            test(`pre-promotion OAuth sign-in cannot create an administrator binding (legacy binding: ${bound})`, async ({ page }) => {
              await administrator(page)
              const flow = await setup({ role: 'user', bound, legacy: true })
              await updateAccount(page, flow.user.id, { role: 'admin', password: 'Fresh-promotion-regression-password!' })
              const before = await db.account.findMany({ where: { userId: flow.user.id } })
              expect(before).toHaveLength(1)
              expect(before[0].providerId).toBe('credential')
              const result = await flow.callback()
              await expectDenied(result)
              expect(new URL(result.headers.get('location')).searchParams.get('error')).toBe('account_not_linked')
              noNewSessionCookie(result)
              expect(await db.account.findMany({ where: { userId: flow.user.id } })).toEqual(before)
              expect(await db.session.count({ where: { userId: flow.user.id } })).toBe(0)
              expect((await db.user.findUniqueOrThrow({ where: { id: flow.user.id } })).emailVerified).toBe(false)
            })
            test(`revoking the initiating session rejects explicit callback writes (existing binding: ${bound})`, async () => {
              const flow = await setup({ bound, explicit: true })
              const before = await db.account.findMany({ where: { userId: flow.user.id } })
              await db.session.delete({ where: { id: flow.sessionId } })
              const result = await flow.callback()
              await expectDenied(result)
              noNewSessionCookie(result)
              expect(await db.account.findMany({ where: { userId: flow.user.id } })).toEqual(before)
              expect(await db.session.count({ where: { userId: flow.user.id } })).toBe(0)
            })
          }
          test('an explicit callback cannot cross demotion and re-promotion even after a new login', async ({ page }) => {
            await administrator(page)
            const flow = await setup({ explicit: true, bound: true })
            await updateAccount(page, flow.user.id, { role: 'user' })
            await updateAccount(page, flow.user.id, { role: 'admin', password: 'New-epoch-administrator-password!' })
            const context = await production.$context
            const replacement = await context.internalAdapter.createSession(flow.user.id)
            expect(replacement.id).not.toBe(flow.sessionId)
            const before = await db.account.findMany({ where: { userId: flow.user.id } })
            await expectDenied(await flow.callback())
            expect(await db.account.findMany({ where: { userId: flow.user.id } })).toEqual(before)
            expect(await db.session.count({ where: { userId: flow.user.id } })).toBe(1)
          })
          test('legacy unsigned and forged explicit-link authorization cannot survive promotion', async ({ page }) => {
            test.setTimeout(90000)
            await administrator(page)
            for (const forged of [false, true]) {
              const flow = await setup({ role: 'user', explicit: true, legacy: true,
                additionalData: forged ? (user, session) => ({ adminLinkAuthorization: { userId: user.id, sessionId: session.id, signature: '0'.repeat(64) } }) : undefined,
              })
              await updateAccount(page, flow.user.id, { role: 'admin', password: 'Legacy-state-must-not-survive!' })
              const before = await db.account.findMany({ where: { userId: flow.user.id } })
              await expectDenied(await flow.callback())
              expect(await db.account.findMany({ where: { userId: flow.user.id } })).toEqual(before)
              expect(await db.session.count({ where: { userId: flow.user.id } })).toBe(0)
            }
          })
          test('the initiation hook replaces client-supplied link authorization with the authenticated session', async () => {
            const flow = await setup({ explicit: true, additionalData: { adminLinkAuthorization: { userId: 'not-the-owner', sessionId: 'forged', signature: '0'.repeat(64) } } })
            const result = await flow.callback()
            expect(result.status()).toBe(302)
            expect(result.headers.get('location')).toBe(`${origin}/settings`)
            expect(await db.account.count({ where: { userId: flow.user.id, providerId: 'github' } })).toBe(1)
          })
          test('an expired initiating session cannot authorize an explicit link', async () => {
            const flow = await setup({ explicit: true })
            await db.session.update({ where: { id: flow.sessionId }, data: { expiresAt: new Date(Date.now() - 1000) } })
            await expectDenied(await flow.callback())
            expect(await db.account.count({ where: { userId: flow.user.id } })).toBe(0)
          })
          test('explicit callback waits for session revocation and refuses the binding after its commit', async () => {
            const flow = await setup({ explicit: true })
            let release, ready
            const gate = new Promise(resolve => { release = resolve })
            const started = new Promise(resolve => { ready = resolve })
            const revocation = db.$transaction(async tx => {
              const [{ pid }] = await tx.$queryRaw`SELECT pg_backend_pid() AS pid`
              await tx.session.delete({ where: { id: flow.sessionId } })
              ready(pid)
              await gate
            }, { timeout: 15000 })
            const pid = await Promise.race([started, revocation.then(() => { throw new Error('Revocation finished before barrier') })])
            const callback = flow.callback()
            try {
              await expect.poll(async () => {
                const [{ waiting }] = await db.$queryRaw`SELECT count(*)::int AS waiting FROM pg_stat_activity WHERE ${pid} = ANY(pg_blocking_pids(pid)) AND query LIKE '%FROM sessions%'`
                return waiting
              }, { timeout: 5000 }).toBeGreaterThan(0)
            } finally { release() }
            await revocation
            await expectDenied(await callback)
            expect(await db.account.count({ where: { userId: flow.user.id } })).toBe(0)
            expect(await db.session.count({ where: { userId: flow.user.id } })).toBe(0)
          })
          ''')
          p = 'tests/browser/z-compact-mobile.e2e.mjs'
          append(p, '''async function matchingDeliveryActions(group) {
            const ordinary = group.locator('[data-link-kind="subscription"]')
            const rocket = group.locator('[data-link-kind="shadowrocket"]')
            await expect(ordinary).toBeVisible()
            await expect(rocket).toBeVisible()
            const style = element => {
              const css = getComputedStyle(element)
              const icon = getComputedStyle(element.querySelector('svg'))
              return [css.backgroundColor, css.color, css.borderRadius, css.fontSize, css.fontWeight, css.borderWidth, icon.width, icon.height, icon.strokeWidth]
            }
            expect(await rocket.evaluate(style)).toEqual(await ordinary.evaluate(style))
            expect((await rocket.boundingBox()).height).toBeGreaterThanOrEqual(44)
            expect((await ordinary.boundingBox()).height).toBeGreaterThanOrEqual(44)
            await expect(group.locator('.o-rocket-copy')).toHaveCount(0)
          }
          test('Shadowrocket follows shared action styling in light/dark desktop and compact mobile layouts', async ({ page, browserName }) => {
            await signIn(page)
            await mkdir('tests/browser/evidence', { recursive: true })
            for (const width of [1440, 390, 320]) for (const theme of ['light', 'dark']) {
              await page.setViewportSize({ width, height: width > 1000 ? 1000 : 844 })
              await loaded(page, '/users')
              await page.evaluate(dark => document.documentElement.classList.toggle('dark', dark), theme === 'dark')
              const rocket = page.getByRole('button', { name: '复制 lin.design@example.test 的 Shadowrocket 链接', exact: true })
              await rocket.scrollIntoViewIfNeeded()
              const group = rocket.locator('..')
              await matchingDeliveryActions(group)
              const box = await group.boundingBox()
              expect(box.x).toBeGreaterThanOrEqual(0)
              expect(box.x + box.width).toBeLessThanOrEqual(width + 1)
              await rocket.focus()
              expect(await rocket.evaluate(el => getComputedStyle(el).outlineStyle)).not.toBe('none')
              await noOverflow(page)
              await page.screenshot({ path: `tests/browser/evidence/${browserName}-delivery-${width}-${theme}.png` })
            }
          })
          test('drawer and creation delivery actions share the UI and copy without consuming access counts', async ({ page, browserName }) => {
            const database = new URL(process.env.DATABASE_URL || 'invalid:')
            if (process.env.WORKSPACE_E2E !== '1' || !['localhost', '127.0.0.1'].includes(database.hostname) || database.pathname !== '/workspace_e2e') throw new Error('Delivery fixtures require local workspace_e2e.')
            await page.setViewportSize({ width: 390, height: 844 })
            await signIn(page)
            await page.addInitScript(() => {
              window.ClipboardItem = undefined
              window.__deliveryText = ''
              Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { writeText: async text => { window.__deliveryText = text } } })
            })
            const contentRequests = []
            page.on('request', request => { if (new URL(request.url()).pathname.startsWith('/api/sub/')) contentRequests.push(request.url()) })
            await loaded(page, '/users')
            const account = (await (await page.request.get('/api/workspace?view=accounts&q=lin.design')).json()).users[0]
            const metadata = async id => (await (await page.request.get(`/api/users/${id}/subscription`)).json()).subscription
            async function verifyCopies(dialog, id, label) {
              const before = await metadata(id)
              const group = dialog.getByRole('group', { name: '订阅链接交付', exact: true })
              for (const theme of ['light', 'dark']) {
                await page.evaluate(dark => document.documentElement.classList.toggle('dark', dark), theme === 'dark')
                await matchingDeliveryActions(group)
                expect(await dialog.evaluate(el => el.scrollWidth <= el.clientWidth + 1)).toBe(true)
                await page.screenshot({ path: `tests/browser/evidence/${browserName}-delivery-${label}-${theme}.png` })
              }
              const rocket = group.locator('[data-link-kind="shadowrocket"]')
              await rocket.focus()
              await rocket.press('Enter')
              await expect.poll(() => page.evaluate(() => window.__deliveryText.startsWith('sub://'))).toBe(true)
              const value = await page.evaluate(() => window.__deliveryText)
              expect(Buffer.from(value.slice(6), 'base64').toString('utf8')).toBe(`${new URL(page.url()).origin}/api/sub/${before.token}`)
              await expect(rocket).toBeEnabled()
              await group.locator('[data-link-kind="subscription"]').click()
              await expect.poll(() => page.evaluate(() => window.__deliveryText)).toBe(`${new URL(page.url()).origin}/api/sub/${before.token}`)
              await expect(rocket).toBeEnabled()
              expect((await metadata(id)).accessCount).toBe(before.accessCount)
            }
            await page.getByRole('button', { name: '管理 lin.design@example.test', exact: true }).click()
            let dialog = page.getByRole('dialog')
            await dialog.getByRole('button', { name: '链接与额度', exact: true }).click()
            await verifyCopies(dialog, account.id, 'drawer')
            await dialog.getByRole('button', { name: '关闭详情', exact: true }).click()
            let createdId
            try {
              await page.getByRole('button', { name: '创建账户', exact: true }).click()
              dialog = page.getByRole('dialog')
              await dialog.getByRole('textbox', { name: '账户邮箱', exact: true }).fill(`delivery-${browserName}-${Date.now()}@example.test`)
              const responsePromise = page.waitForResponse(response => new URL(response.url()).pathname === '/api/users' && response.request().method() === 'POST')
              await dialog.getByRole('button', { name: '创建账户', exact: true }).click()
              const response = await responsePromise
              expect(response.status()).toBe(200)
              createdId = (await response.json()).user.id
              await expect(dialog.getByRole('heading', { name: '账户已准备好', exact: true })).toBeVisible()
              await verifyCopies(dialog, createdId, 'created')
              expect(contentRequests).toEqual([])
            } finally {
              if (createdId) expect((await page.request.delete(`/api/users/${createdId}`)).status()).toBe(200)
            }
          })
          ''')
          append('DESIGN.md', '''## 订阅交付控件一致性

          Shadowrocket 与普通订阅复制复用 `SubscriptionActions` 和 `Action`；列表使用 quiet 操作组，详情和创建完成态使用相同的 secondary 按钮。不得单独添加品牌色底、不同字号/圆角或特殊悬停样式。两种链接均保留 Lucide 图标、可读名称与直接入口；窄屏自然换行，点击区不小于 44px。复制回调必须在原点击事件内同步发起，不能为动画或加载效果延迟剪贴板调用。''')
          append('docs/admin-only-accounts.md', '''## OAuth 升级边界与绑定会话

          GitHub 登录不再根据相同邮箱自动建立账号绑定（`disableImplicitLinking: true`）。管理员首次使用 GitHub 须先用密码登录，再从设置主动绑定；已有有效绑定仍可登录。升级前发起的 sign-in state 在升级清理旧绑定后不能重新建绑。

          主动绑定由服务端将发起会话 ID、用户 ID 及会话密钥派生的 HMAC 写入 OAuth state，覆盖客户端提供的同名值；state 不含原始会话 token。认证 adapter 在同一写事务内锁定用户并共享锁定该确切会话，再检查有效期及签名。撤销/到期、降级后重新升级、更换登录会话，以及不含新证明的历史 state 均不能恢复旧绑定。其他管理员及新会话不被全局注销。不增加数据库字段，也不放宽原角色锁或扫描规则。

          回归沿用真实 Better Auth handler/state、Prisma 和本地 PostgreSQL，仅替代三次外部 GitHub 响应。覆盖未绑定/历史绑定的真实 HTTP 升级、旧显式绑定、伪造证明、会话到期、撤销后回调、原会话被新会话替换，以及通过 `pg_blocking_pids` 确认等待撤销事务的并发路径。仍保留已绑定登录及正常主动绑定正向对照；不把外部响应夹具称为真实 GitHub 生产授权验收。''')
          PY
          node --check tests/browser/z-oauth-policy.e2e.mjs
          node --check tests/browser/z-compact-mobile.e2e.mjs
          git diff --check
          git add src/components/workspace/subscription-actions.tsx src/components/workspace/accounts.tsx src/components/workspace/account-editor.tsx src/styles/workspace.css src/components/workspace/login.tsx tests/browser/z-oauth-policy.e2e.mjs tests/browser/z-compact-mobile.e2e.mjs DESIGN.md docs/admin-only-accounts.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify subscription delivery UI and cover OAuth promotion boundaries'
          git push origin HEAD:fix/admin-only-subscription-accounts
          git rev-parse HEAD
