name: Prepare PR28 refinements
on:
  pull_request:
    paths:
      - .github/workflows/pr28-refine.yml
permissions:
  contents: write
jobs:
  refine:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/admin-only-subscription-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply the pinned scoped patch with corrected native Response assertions
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap
          workflow = '.github/workflows/pr28-refine.yml'
          baseline = 'f5b135b1d6b7a1a34e61943a75af70bef517ba9d'
          changes = subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines()
          assert changes == [workflow], f'Unexpected concurrent source changes: {changes}'
          pinned = '5ac531d2f7c1f2b91943a8ce0864ea16165188a5:' + workflow
          assert subprocess.check_output(['git', 'rev-parse', pinned], text=True).strip() == '9d7f206b01c763767b3fbdfd4469a1dcb71cdfc4'
          source = subprocess.check_output(['git', 'show', pinned], text=True)
          script = textwrap.dedent(source.split("          python3 - <<'PY'\n", 1)[1].split('          PY\n', 1)[0])
          # Native Fetch Response exposes status as a property, unlike Playwright APIResponse.
          assert script.count('expect(response.status()).toBe(302)') == 2
          script = script.replace('expect(response.status()).toBe(302)', 'expect(response.status).toBe(302)')
          assert script.count('expect(result.status()).toBe(302)') == 1
          script = script.replace('expect(result.status()).toBe(302)', 'expect(result.status).toBe(302)')
          old = "email ? `复制 ${email} 的 ${kind}链接`"
          assert script.count(old) == 1
          script = script.replace(old, "email ? `复制 ${email} 的${kind === '订阅' ? '' : ' '}${kind}链接`")
          exec(compile(script, 'pinned-pr28-refinements', 'exec'))
          PY
          node --check tests/browser/z-oauth-policy.e2e.mjs
          node --check tests/browser/z-compact-mobile.e2e.mjs
          git diff --check
          git add src/components/workspace/subscription-actions.tsx src/components/workspace/accounts.tsx src/components/workspace/account-editor.tsx src/styles/workspace.css src/components/workspace/login.tsx tests/browser/z-oauth-policy.e2e.mjs tests/browser/z-compact-mobile.e2e.mjs DESIGN.md docs/admin-only-accounts.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify subscription delivery UI and cover OAuth promotion boundaries'
          git push origin HEAD:fix/admin-only-subscription-accounts
          git rev-parse HEAD
